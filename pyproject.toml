[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vdjcraft"
version = "1.1.1"
description = "A tool to characterize VDJ recombination"
authors = [
    { name = "Kaili Hu", email = "klhu0502@uab.edu", email = "kellyphhu@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

dependencies = [
    "blast>=1.24",
    "minimap2",
    "samtools",
    "pandas>=2.1",
    "biopython>=1.81"
    # add your required packages here
]

# This creates the 'vdjcraft' command
[project.scripts]
vdjcraft = "vdjcraft.cli:main"
